<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROAD RUSH</title>
  <link rel="stylesheet" href="cookin-009.css" />
</head>
<body>

  <!-- ── START SCREEN ── -->
  <div id="startScreen" class="overlay active">
    <div class="overlay-box">
      <h1 class="game-title">ROAD RUSH</h1>
      <p class="subtitle">Top-Down Racing</p>
      <div class="controls-info">
        <h3>CONTROLS</h3>
        <table>
          <tr><td><kbd>W</kbd> / <kbd>↑</kbd></td><td>Accelerate</td></tr>
          <tr><td><kbd>S</kbd> / <kbd>↓</kbd></td><td>Brake</td></tr>
          <tr><td><kbd>A</kbd> / <kbd>←</kbd></td><td>Move Left</td></tr>
          <tr><td><kbd>D</kbd> / <kbd>→</kbd></td><td>Move Right</td></tr>
          <tr><td><kbd>Space</kbd></td><td>Nitro Boost</td></tr>
          <tr><td><kbd>P</kbd> / <kbd>Esc</kbd></td><td>Pause</td></tr>
        </table>
      </div>
      <div id="bestScoreStart" class="best-score">BEST SCORE: 000000</div>
      <button id="startBtn" class="btn btn-primary">START GAME</button>
    </div>
  </div>

  <!-- ── PAUSE SCREEN ── -->
  <div id="pauseScreen" class="overlay">
    <div class="overlay-box">
      <h2 class="screen-title">PAUSED</h2>
      <button id="resumeBtn"       class="btn btn-primary">RESUME</button>
      <button id="restartBtnPause" class="btn btn-secondary">RESTART</button>
    </div>
  </div>

  <!-- ── GAME OVER SCREEN ── -->
  <div id="gameOverScreen" class="overlay">
    <div class="overlay-box">
      <h2 class="crash-title">GAME OVER</h2>
      <p id="finalScore" class="final-score">SCORE: 000000</p>
      <p id="finalBest"  class="final-best" >BEST:  000000</p>
      <button id="restartBtn" class="btn btn-primary">PLAY AGAIN</button>
      <button id="menuBtn"    class="btn btn-secondary">MAIN MENU</button>
    </div>
  </div>

  <!-- ── GAME CANVAS ── -->
  <canvas id="gameCanvas"></canvas>

  <!-- ── HUD (DOM layer rendered above canvas) ── -->
  <div id="hud" class="hud-hidden">
    <div id="hudLeft">
      <div class="hud-item">SCORE <span id="hudScore">000000</span></div>
      <div class="hud-item">BEST  <span id="hudBest">000000</span></div>
    </div>
    <div id="hudRight">
      <div class="hud-item">SPEED <span id="hudSpeed">0</span> <small>KM/H</small></div>
      <div class="hud-item lives" id="hudLives">❤️ ❤️ ❤️</div>
      <div class="hud-nitro">
        NITRO
        <div class="nitro-bar-wrap"><div id="nitroBar" class="nitro-bar"></div></div>
      </div>
    </div>
    <button id="pauseBtn" title="Pause (P / Esc)">⏸</button>
  </div>

  <script src="cookin-009.js"></script>
</body>
</html>
